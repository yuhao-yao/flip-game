<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FLIP</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{scrollbar-width:none}
html::-webkit-scrollbar{width:0;height:0;display:none}
 body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  user-select:none;touch-action:manipulation;color:#1D1D1F;padding:12px;min-height:100vh}
 body::before,body::after{content:'';position:fixed;inset:0;z-index:-1;transition:opacity .8s}
 body::before{background:#F5F5F7;opacity:1}
 body::after{background:#000000;opacity:0}
 body.deep::before{opacity:0}
 body.deep::after{opacity:1}
 body.deep{color:#F5F5F7}
 .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
 h1{font-size:19px;font-weight:600;letter-spacing:2px;color:#1D1D1F;transition:color .8s}
 body.deep h1{color:#F5F5F7}
 h1 span{font-size:11px;color:#86868B;font-weight:500;letter-spacing:2px}
 body.deep h1 span{color:#98989F}
 .lvlchip{padding:4px 12px;border-radius:99px;font-size:12px;cursor:pointer;
  background:#FFFFFF;border:1px solid #D2D2D7;color:#1D1D1F;transition:background .5s,color .5s}
body.deep .lvlchip{background:#2C2C2E;border-color:#3A3A3C;color:#F2F2F2}
 .mtabs{display:flex;background:#FFFFFF;border:1px solid #D2D2D7;border-radius:99px;padding:2px;
  transition:background .5s,border-color .5s}
 .mtabs button{border:0;border-radius:99px;padding:3px 11px;font-size:11px;font-weight:600;cursor:pointer;
  background:transparent;color:#86868B;transition:background .3s,color .3s}
 .mtabs button.on{background:#1D1D1F;color:#FFFFFF}
 body.deep .mtabs{background:#1C1C1E;border-color:#3A3A3C}
 body.deep .mtabs button{color:#98989F}
 body.deep .mtabs button.on{background:#48484E;color:#F5F5F7}
 .status.hintst{color:#1D1D1F;font-weight:600}
 body.deep .status.hintst{color:#FFFFFF}
 .scene{perspective:1100px;width:min(92vw,378px,calc(100vh - 185px));position:relative}
 .scene.n4{width:min(86vw,334px,calc(100vh - 185px))}
 .scene.n6{width:min(94vw,440px,calc(100vh - 185px))}
 .scene.n8{width:min(94vw,470px,calc(100vh - 185px))}
 .scene.n10{width:min(95vw,505px,calc(100vh - 185px))}
 .scene.n12{width:min(96vw,540px,calc(100vh - 185px))}
 .ripple{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;
  border:3px solid #007AFF88;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:0}
 .ripple.go{animation:rip .75s ease-out}
 @keyframes rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}
 .card{position:relative;width:100%;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.45,.05,.2,1)}
 .card.flipped{transform:rotateX(180deg)}
 .face{display:grid;gap:3px;padding:10px;border-radius:24px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
 .face.day{background:#FFFFFF;box-shadow:0 2px 12px rgba(0,0,0,.06)}
 .face.night{position:absolute;inset:0;transform:rotateX(180deg);visibility:hidden;
  background:#1C1C1E;box-shadow:0 8px 32px rgba(0,0,0,.6);pointer-events:none}
 .card.flipped .face.night{pointer-events:auto}
 .card.flipped .face.day{pointer-events:none}
 .card.showN .face.night{visibility:visible}
 .card.showN .face.day{visibility:hidden}
 .cell{aspect-ratio:1;position:relative;transition:transform .08s;cursor:pointer;
  border-radius:14%;touch-action:none}
 .cell:active{transform:scale(.96)}
 .face.day .cell{background:var(--day)}
 .face.night .cell{background:var(--ngt);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
 .pad{position:absolute;left:50%;top:50%;width:56%;height:56%;transform:translate(-50%,-50%);
  border-radius:50%;z-index:4;animation:padin .2s ease}
 .face.day .pad{background:radial-gradient(circle at 35% 30%,#FFFFFF,#EDEDF0);
  box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(0,0,0,.06)}
 .face.night .pad{background:radial-gradient(circle at 35% 30%,#3A3A3C,#151517);
  box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.10)}
 @keyframes padin{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}
 .x{position:absolute;left:50%;top:50%;width:54%;height:54%;transform:translate(-50%,-50%);
  z-index:4;animation:xfade .16s ease}
 .x::before,.x::after{content:'';position:absolute;left:50%;top:50%;width:100%;height:24%;
  border-radius:99px;transform:translate(-50%,-50%) rotate(45deg);
  background:linear-gradient(180deg,#5E5E63,#2E2E32);box-shadow:0 1px 2px rgba(0,0,0,.22)}
 .x::after{transform:translate(-50%,-50%) rotate(-45deg)}
 .face.night .x::before,.face.night .x::after{background:linear-gradient(180deg,#FFFFFF,#C7C7CC);
  box-shadow:0 1px 2px rgba(0,0,0,.35)}
 @keyframes xfade{from{opacity:0;transform:translate(-50%,-50%) scale(.35)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
 .cell.bad{outline:2.5px solid #FF3B30;outline-offset:-2.5px}
 .lbl{position:absolute;font-size:9px;font-weight:700;z-index:2}
 .n8 .lbl{font-size:7px}
 .n10 .lbl,.n12 .lbl{font-size:6px}
 .n12 .pad{width:62%;height:62%}
 .face.day .lbl{left:4px;top:2px;color:rgba(0,0,0,.30)}
 .face.night .lbl{right:4px;bottom:2px;color:rgba(255,255,255,.40)}
 .face.day .cell.hint .lbl,.face.day .cell.exclh .lbl{color:#1D1D1F;font-weight:800}
 .face.night .cell.hint .lbl,.face.night .cell.exclh .lbl{color:#FFFFFF;font-weight:800}
 .cell.hint::after{content:'';position:absolute;inset:15%;border-radius:50%;border:4px solid #2E2E32;
  z-index:5;pointer-events:none;
  animation:hintIn .32s cubic-bezier(.25,.9,.3,1.15) both,breath 1.3s .34s ease-in-out infinite}
 .face.night .cell.hint::after{border-color:#FFFFFF}
 .cell.exclh::after{content:'';position:absolute;inset:19%;border-radius:50%;border:4px dashed #2E2E32;
  z-index:5;pointer-events:none;
  animation:hintIn .32s cubic-bezier(.25,.9,.3,1.15) both,breath 1.3s .34s ease-in-out infinite}
 .face.night .cell.exclh::after{border-color:#FFFFFF}
 .n12 .cell.hint::after{inset:20%}
 .n12 .cell.exclh::after{inset:24%}
 @keyframes hintIn{0%{transform:scale(1.5);opacity:0}55%{opacity:1}100%{transform:scale(1);opacity:.55}}
 @keyframes breath{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
 .mrip{position:absolute;inset:4%;border-radius:12px;border:2px solid #007AFF99;
  pointer-events:none;z-index:6;animation:mrip .45s ease-out forwards}
 .face.night .mrip{border-color:#64AFFF99}
 @keyframes mrip{from{opacity:.85;transform:scale(.55)}to{opacity:0;transform:scale(1.16)}}
 .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
 .btns button{padding:7px 13px;border:0;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:600;
  background:#E9E9EB;color:#1D1D1F;transition:background .5s,color .5s}
  .btns button:active{transform:scale(.95)}
  .btns button.off{opacity:.45;filter:grayscale(1)}
 #flipBtn{padding:9px 22px;font-size:14px;background:#007AFF;color:#FFFFFF}
 body.deep .btns button{background:#2C2C2E;color:#F2F2F2}
 body.deep #flipBtn{background:#0A84FF;color:#FFFFFF}
 #flipBtn.urge{animation:urge 1.5s ease-in-out infinite}
 @keyframes urge{0%,100%{box-shadow:0 3px 14px #007AFF40}50%{box-shadow:0 3px 26px #007AFFb0;transform:translateY(-1px)}}
 .dots{display:flex;gap:5px;height:8px;align-items:center}
 .dot{width:7px;height:7px;border-radius:50%;background:#D1D1D6;transition:background .3s,transform .3s}
 .dot.on{background:#007AFF;transform:scale(1.2)}
 body.deep .dot{background:#3A3A3C}
body.deep .dot.on{box-shadow:0 0 0 1.5px rgba(255,255,255,.45)}
 .qbtn{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;font-size:14px;font-weight:600;
  background:#E9E9EB;color:#1D1D1F;line-height:1;padding:0;transition:background .5s,color .5s}
 body.deep .qbtn{background:#2C2C2E;color:#F2F2F2}
 .tut{position:fixed;inset:0;background:#1D1D1Fd9;display:flex;align-items:center;justify-content:center;
  z-index:11;opacity:0;pointer-events:none;transition:opacity .4s}
 .tut.show{opacity:1;pointer-events:auto}
 .tut .wrap{width:min(94vw,432px);max-height:88vh;display:flex;flex-direction:column;
  background:#F5F5F7;border-radius:22px;box-shadow:0 16px 50px rgba(0,0,0,.5);overflow:hidden}
 .tut .thead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
 .tut .thead h3{color:#1D1D1F;font-size:16px;letter-spacing:2px}
 .tut .xbtn{width:28px;height:28px;border-radius:50%;border:0;background:#E9E9EB;color:#1D1D1F;
  font-size:13px;font-weight:600;cursor:pointer;line-height:1;padding:0}
 .tut .ttabs{display:flex;gap:6px;padding:0 16px 9px}
 .tut .ttabs button{flex:1;padding:7px 0;border:0;border-radius:11px;background:#E9E9EB;color:#86868B;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
 .tut .ttabs button.on{background:#1D1D1F;color:#FFFFFF}
 .tut .tbody{overflow:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
 .tut .tbody::-webkit-scrollbar{width:0;height:0;display:none}
 .tut .tfoot{padding:10px 16px 14px}
 .tut .go{width:100%;padding:11px 0;border:0;border-radius:14px;background:#0A84FF;color:#FFFFFF;
  font-size:14px;font-weight:600;cursor:pointer}
 .tut p{color:#6E6E73;font-size:12px;line-height:1.7;margin:2px 2px 0}
 .tut p b{color:#1D1D1F}
 .tpanel{background:#FFFFFF;border-radius:14px;padding:11px;box-shadow:0 1px 6px rgba(0,0,0,.05);
  display:flex;gap:12px;align-items:center}
 .tpanel.wide{flex-direction:column;align-items:stretch}
 .tpanel .txt{flex:1;min-width:0}
 .tpanel h4{color:#1D1D1F;font-size:12.5px;margin-bottom:5px}
  .trow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:7px}
  .tcol{display:flex;flex-direction:column;gap:10px;flex:none}
 .tcap{font-size:10.5px;color:#86868B;line-height:1.6}
 .tpanel.wide h4{text-align:center}
 .tpanel.wide .tcap{text-align:center}
 .tboard{display:grid;gap:2px;padding:6px;border-radius:11px;background:#FFFFFF;
  box-shadow:0 2px 10px rgba(0,0,0,.12);flex:none;position:relative}
 .tboard.dark{background:#1C1C1E;box-shadow:0 4px 14px rgba(0,0,0,.35)}
 .tboard .cell{position:relative;width:25px;height:25px;border-radius:14%}
 .tboard .pad,.tboard .x{animation:none}
 .tboard .pad{background:radial-gradient(circle at 35% 30%,#FFFFFF,#EDEDF0);
  box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(0,0,0,.06)}
 .tboard.dark .cell{box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
 .tboard.dark .pad{background:radial-gradient(circle at 35% 30%,#3A3A3C,#151517);
  box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.10)}
 .tboard.dark .x::before,.tboard.dark .x::after{background:linear-gradient(180deg,#FFFFFF,#C7C7CC);
  box-shadow:0 1px 2px rgba(0,0,0,.35)}
 .tboard .cell.tring::after{content:'';position:absolute;inset:6%;border-radius:50%;
  border:2px solid #0A84FF;z-index:6;pointer-events:none}
 .tboard.s .cell{width:17px;height:17px}
 .tboard .x.pop{animation:xfade .18s ease}
 .tboard .x.fade{transition:opacity .4s;opacity:0}
 .dfg{position:absolute;width:18px;height:18px;border-radius:50%;
  background:rgba(29,29,31,.72);box-shadow:0 0 0 5px rgba(29,29,31,.22);opacity:0;
  transition:opacity .3s;z-index:7;pointer-events:none}
 .status{font-size:13px;color:#6E6E73;min-height:18px;text-align:center;transition:color .8s}
 body.deep .status{color:#98989F}
 .status.err{color:#FF3B30}
 body.deep .status.err{color:#FF453A}
 .status.ok{color:#34C759;font-weight:600}
 body.deep .status.ok{color:#30D158}
 .win{position:fixed;inset:0;background:#1D1D1Fee;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;z-index:9;opacity:0;pointer-events:none;transition:opacity .5s}
 .win.show{opacity:1;pointer-events:auto}
 .win .emblem{display:flex;align-items:center;gap:9px}
 .win .mb{display:grid;padding:5px;border-radius:9px;position:relative}
 .win .mbd{background:#F5F5F7;box-shadow:0 4px 14px rgba(0,0,0,.5)}
 .win .mbn{background:#1C1C1E;box-shadow:0 4px 14px rgba(0,0,0,.65)}
 .win .mbc{border-radius:14%;position:relative}
 .win .mbn .mbc{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06)}
 .win .mbp{position:absolute;inset:19%;border-radius:50%}
 .win .mbd .mbp{background:radial-gradient(circle at 35% 30%,#FFFFFF,#EDEDF0);
  box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 0 0 .5px rgba(0,0,0,.06)}
 .win .mbn .mbp{background:radial-gradient(circle at 35% 30%,#3A3A3C,#151517);
  box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.10)}
 .win .mbk{position:absolute;right:-6px;top:-6px;width:17px;height:17px;border-radius:50%;background:#0A84FF;
  color:#FFFFFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
 .win .mbar{color:#48484E;font-size:15px;font-weight:600}
 .win h2{color:#F5F5F7;font-size:21px;letter-spacing:5px}
 .win p{color:#98989F;font-size:12.5px;letter-spacing:1px}
 .win button{margin-top:4px;padding:9px 26px;border:0;border-radius:99px;cursor:pointer;
  background:#0A84FF;color:#FFFFFF;font-size:13.5px;font-weight:600}
 .win .row{display:flex;gap:10px}
 .lsel{position:fixed;inset:0;background:#1D1D1Ff2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:10;opacity:0;pointer-events:none;transition:opacity .4s}
 .lsel.show{opacity:1;pointer-events:auto}
 .lsel h3{color:#F5F5F7;font-size:18px;letter-spacing:6px}
 .lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:min(92vw,430px);max-height:min(62vh,500px);overflow-y:auto;padding:2px;scrollbar-width:none}
 .lgrid::-webkit-scrollbar{width:0;height:0;display:none}
 .lgrid button.ltile{position:relative;padding:6px 2px 4px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;
  background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;transition:background .2s}
 .lgrid button.ltile:hover{background:#2C2C2E66}
 .lgrid button.ltile.cur{border-color:#F5F5F7}
 .lgrid button.ltile.cur .wcap{color:#F5F5F7}
 .lgrid button.ltile.done .wmb{opacity:.38;filter:saturate(.25)}
 .lgrid button.ltile.done .wcap::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#30D158;margin-right:4px;vertical-align:1.5px}
 .wmb{display:grid;gap:1px;pointer-events:none}
 .wmb i{display:block;border-radius:1.5px;position:relative}
 .wmb i b{position:absolute;inset:16%;border-radius:50%;background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
 .wcap{font-size:10px;font-weight:600;color:#98989F;pointer-events:none}
 .lsel>button{padding:9px 30px;border:0;border-radius:99px;cursor:pointer;
  background:#0A84FF;color:#FFFFFF;font-size:13.5px;font-weight:600}
</style>
</head>
<body>
  <div class="topbar">
   <h1>FLIP</h1>
   <div class="mtabs" id="mtabs" title="单子:每区 1 子(50 关) / 双子:每区 2 子(20 关)">
    <button id="mtMain" class="on" onclick="setMode(false)">单子</button>
    <button id="mt2" onclick="setMode(true)">双子</button>
   </div>
   <div class="lvlchip" id="lvlchip" onclick="openLsel()">第一关 · 5×5</div>
  <button class="qbtn" id="qbtn" onclick="openTut()">?</button>
  <div class="dots" id="dots"></div>
 </div>
 <div class="scene" id="scene">
  <div class="ripple" id="ripple"></div>
  <div class="card" id="card">
   <div class="face day" id="dayFace"></div>
   <div class="face night" id="nightFace"></div>
  </div>
 </div>
 <div class="btns">
  <button id="flipBtn" onclick="flip()">翻转</button>
  <button onclick="hint()">提示</button>
  <button onclick="undo()">撤销</button>
  <button onclick="reset()">重置</button>
   <button id="sndBtn" onclick="toggleSound()">🔊</button>
   <button id="bgmBtn" onclick="toggleBgm()">🎵</button>
 </div>
 <div class="tut" id="tut" onclick="if(event.target===this)closeTut()">
  <div class="wrap">
   <div class="thead"><h3 id="tutTitle">怎 么 玩</h3><button class="xbtn" onclick="closeTut()">✕</button></div>
   <div class="ttabs"><button id="ttabA" class="on" onclick="tutTab(0)">玩法说明</button><button id="ttabB" onclick="tutTab(1)">进阶</button></div>
    <div class="tbody" id="tutWrap"></div>
   <div class="tfoot"><button class="go" onclick="closeTut()">知道了 · 开始玩</button></div>
  </div>
 </div>
 <div class="status" id="status"></div>
 <div class="win" id="win">
  <div class="emblem" id="emblem"></div>
  <h2 id="winTitle">已通关</h2>
  <p id="winSub"></p>
  <p id="winStats"></p>
  <div class="row">
   <button onclick="reset()">再玩本关</button>
   <button id="nextBtn" onclick="nextLevel()">下一关 →</button>
  </div>
 </div>
  <div class="lsel" id="lsel">
   <h3 id="lselTitle">关卡</h3>
  <div class="lgrid" id="lgrid"></div>
  <button onclick="closeLsel()">关 闭</button>
 </div>
<script>
const LEVELS=[
{n:5,day:["AAAAA","BBBBB","CCCCC","DDDDD","EEEEE"],night:["QSSSP","QQSTP","RQSTP","RQRTP","RRRTP"],anchors:[11],tip:"每行 1 子 · 每列 1 子 · 任两子不相邻<br>正面的色带只是行——真正的色区在<b>背面</b>(正面的另一面):点「翻转」",hf:"both",pig:false,sol:[2,4,1,3,0]},
{n:5,day:["CCAAA","CDAEB","CDAEB","DDEEB","DDEBB"],night:["SSPPP","SSPQQ","RRPQQ","RRTQQ","TTTTT"],anchors:[5],tip:"<b>两个面各有一套色区</b>,每区都恰 1 子<br>正面推不动就翻到背面;背面卡了,再翻回来",hf:"both",pig:false,sol:[2,0,3,1,4]},
{n:5,day:["EEECC","ADECB","ADDCB","ADDBB","AAABB"],night:["TTTTT","SPPQQ","SPPQQ","SSPRR","SSPRR"],anchors:[1],tip:"找<b>包含关系</b>:某组的候选全挤进同一区 → 该区被占定,<b>其余格可排除</b>(标 ✕ 后生效)<br>两个面都要用",hf:"both",pig:true,sol:[1,3,0,2,4]},
{n:5,day:["CAAAB","CCABB","CEAAB","EEDDB","EEDDB"],night:["SSRRR","SSRQP","TSQQP","TTQPP","TTTPP"],anchors:[3],tip:"一面卡住,另一面往往正通着——<b>两面交替</b>推进",hf:"both",pig:false,sol:[3,1,4,2,0]},
{n:5,day:["DDAEE","DDAEE","BDAEE","BBACC","BBBCC"],night:["SSQQT","RSQQT","RSSQT","RPPQT","RPPPP"],anchors:[21],tip:"<b>单看任何一面都推不动</b>——两面交替使用",hf:"both",pig:false,sol:[3,0,2,4,1]},

let AC=null;
function actx(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
 if(AC&&AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f0,f1,dur,type,vol,delay){
 const a=actx();if(!a||!PST.sound)return;
 const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
 if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(vol||.12,t+.014);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);
}

 const BGM={on:false,g:null,lp:null,nb:null,tid:0,ct:0,bt:0,bn:0,mi:4};
 const BGM_CH=[[174.61,220,261.63,329.63],[164.81,196,246.94,293.66],[146.83,174.61,220,261.63],[130.81,164.81,196,246.94]];
 const BGM_PN=[261.63,293.66,329.63,392,440,523.25,587.33,659.26,783.99,880];
 const BGM_ARP=[0,1,2,3,2,3,1,2];
 function bgmStart(){
  const a=actx();if(!a||BGM.on)return;BGM.on=true;
  BGM.g=a.createGain();BGM.g.gain.setValueAtTime(0,a.currentTime);
  BGM.g.gain.linearRampToValueAtTime(1,a.currentTime+2);
  BGM.lp=a.createBiquadFilter();BGM.lp.type='lowpass';BGM.lp.frequency.value=3400;
  BGM.g.connect(BGM.lp);BGM.lp.connect(a.destination);
  if(!BGM.nb){const b=a.createBuffer(1,a.sampleRate,a.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;BGM.nb=b;}
  BGM.bt=a.currentTime+.25;BGM.bn=0;
  BGM.tid=setInterval(bgmTick,180);
  bgmCrackle();
 }
 function bgmStop(){
  if(!BGM.on)return;BGM.on=false;
  clearInterval(BGM.tid);clearTimeout(BGM.ct);
  const a=AC,g=BGM.g,lp=BGM.lp;
  if(a&&g){try{
   g.gain.cancelScheduledValues(a.currentTime);
   g.gain.setValueAtTime(g.gain.value,a.currentTime);
   g.gain.linearRampToValueAtTime(0,a.currentTime+.7);
   setTimeout(()=>{try{g.disconnect();lp.disconnect()}catch(e){}},900);}catch(e){}}
  BGM.g=null;BGM.lp=null;
 }
 function bgmTick(){
  if(!BGM.on||!AC)return;const a=AC,BT=60/72;
  if(BGM.bt<a.currentTime-.05){BGM.bn+=(16-BGM.bn%16);BGM.bt=a.currentTime+.15;}
  while(BGM.bt<a.currentTime+.7){
   bgmBeat(BGM.bn,BGM.bt,BT);
   BGM.bt+=BT/2;BGM.bn++;
  }
 }
 function bgmBeat(n,t,BT){
  const e=n%8,ch=BGM_CH[Math.floor(n/16)%4];
  if(e===0||e===5)bgmKick(t);
  if(e===2||e===6)bgmSnare(t);
  if(Math.random()>.42)bgmHat(t);
  if(e%2===0){
   const f=ch[BGM_ARP[Math.floor(n/2)%8]]*(Math.random()<.16?2:1);
   bgmPluck(f,t,.055*(.75+Math.random()*.35));
  }
  if(n%16===0)bgmPad(ch,t,8*BT);
  if(e%4===0&&Math.random()<.45){
   BGM.mi=Math.max(0,Math.min(BGM_PN.length-1,BGM.mi+(Math.random()<.5?-1:1)*(Math.random()<.3?2:1)));
   bgmBell(BGM_PN[BGM.mi],t+BT*.5);
  }
 }
 function bgmKick(t){const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);
  g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g).connect(BGM.g);o.start(t);o.stop(t+.2);}
 function bgmSnare(t){const a=AC,s=a.createBufferSource();s.buffer=BGM.nb;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;
  const g=a.createGain();g.gain.setValueAtTime(.034,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);
  s.connect(f).connect(g).connect(BGM.g);s.start(t);s.stop(t+.12);}
 function bgmHat(t){const a=AC,s=a.createBufferSource();s.buffer=BGM.nb;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=7500;
  const g=a.createGain();g.gain.setValueAtTime(.011,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);
  s.connect(f).connect(g).connect(BGM.g);s.start(t);s.stop(t+.06);}
 function bgmPluck(fr,t,v){const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.value=fr*(1+(Math.random()-.5)*.004);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);
  g.gain.exponentialRampToValueAtTime(.001,t+.55);
  o.connect(g).connect(BGM.g);o.start(t);o.stop(t+.6);}
 function bgmPad(fs,t,dur){fs.forEach(fr=>{const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.value=fr;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.018,t+1.4);
  g.gain.setValueAtTime(.018,t+dur-1.6);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g).connect(BGM.g);o.start(t);o.stop(t+dur+.1);});}
 function bgmBell(fr,t){const a=AC;[[fr,.06],[fr*2,.018]].forEach(p=>{
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=p[0];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+1.1);
  o.connect(g).connect(BGM.g);o.start(t);o.stop(t+1.15);});}
 function bgmCrackle(){
  if(!BGM.on||!AC)return;
  const a=AC,t=a.currentTime+.02,s=a.createBufferSource();s.buffer=BGM.nb;s.playbackRate.value=1+Math.random()*.6;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=3000+Math.random()*3000;f.Q.value=3;
  const g=a.createGain();g.gain.setValueAtTime(.006+Math.random()*.006,t);g.gain.exponentialRampToValueAtTime(.001,t+.03);
  s.connect(f).connect(g).connect(BGM.g);s.start(t);s.stop(t+.05);
  BGM.ct=setTimeout(bgmCrackle,80+Math.random()*320);
 }

/* ---- 推理核心(与生成器逐行同构:单候选 + 鸽笼包含排除) ---- */
function buildGroups(lv,mode,flt){
 const N=lv.n,NA=nightAlpha(N),gs=[];
 for(let r=0;r<N;r++)gs.push({t:'第'+(r+1)+'行',cells:Array.from({length:N},(_,c)=>r*N+c)});
 for(let c=0;c<N;c++)gs.push({t:'第'+(c+1)+'列',cells:Array.from({length:N},(_,r)=>r*N+c)});
 if(flt!=='rc'){
  if(mode!=='night')for(let li=0;li<N;li++){const l=DL12[li],cells=[];
   for(let j=0;j<N*N;j++)if(lv.day[(j/N)|0][j%N]===l)cells.push(j);
   gs.push({t:'正面'+l+'区',cells});}
  if(mode!=='day')for(let li=0;li<N;li++){const l=NA[li],cells=[];
   for(let j=0;j<N*N;j++)if(lv.night[(j/N)|0][j%N]===l)cells.push(j);
   gs.push({t:'背面'+l+'区',cells});}
 }
 gs.forEach(g=>g.cellSet=new Set(g.cells));
 return gs;
}
function padExcl(lv,S,mode,withMarks){
 const N=lv.n,excl=new Array(N*N).fill(false);
 if(withMarks)for(let j=0;j<N*N;j++)if(S[j]===2)excl[j]=true;
 const rowC=new Array(N).fill(0),colC=new Array(N).fill(0),dC={},nC={};
 for(let i=0;i<N*N;i++)if(S[i]===1){
  const r=(i/N)|0,c=i%N;
  rowC[r]++;colC[c]++;
  dC[lv.day[r][c]]=(dC[lv.day[r][c]]||0)+1;
  nC[lv.night[r][c]]=(nC[lv.night[r][c]]||0)+1;
 }
 for(let i=0;i<N*N;i++){
  if(S[i]!==1)continue;
  const r=(i/N)|0,c=i%N;
  if(rowC[r]>=K)for(let k=0;k<N;k++)excl[r*N+k]=true;
  if(colC[c]>=K)for(let k=0;k<N;k++)excl[k*N+c]=true;
  if(mode!=='night'&&dC[lv.day[r][c]]>=K){const dl=lv.day[r][c];
   for(let j=0;j<N*N;j++)if(lv.day[(j/N)|0][j%N]===dl)excl[j]=true;}
  if(mode!=='day'&&nC[lv.night[r][c]]>=K){const nl=lv.night[r][c];
   for(let j=0;j<N*N;j++)if(lv.night[(j/N)|0][j%N]===nl)excl[j]=true;}
  for(let rr=Math.max(0,r-1);rr<=Math.min(N-1,r+1);rr++)
   for(let cc=Math.max(0,c-1);cc<=Math.min(N-1,c+1);cc++)
    excl[rr*N+cc]=true;
 }
 return excl;
}
function applyPig(lv,S,excl,groups,trace){
 for(;;){
  let applied=false;
  for(let Gi=0;Gi<groups.length;Gi++){
   const G=groups[Gi];
   const need=K-G.cells.filter(j=>S[j]===1).length;
   if(need<=0)continue;
   const cand=G.cells.filter(j=>!excl[j]&&S[j]!==1);
   if(cand.length<need)continue;
   const candSet=new Set(cand);
   for(let Hj=0;Hj<groups.length;Hj++){
    if(Hj===Gi)continue;
    const H=groups[Hj];
    if(H.cells.length<cand.length)continue;
    let sub=true;
    for(const j of cand){if(!H.cellSet.has(j)){sub=false;break;}}
    if(!sub)continue;
    if(K-H.cells.filter(j=>S[j]===1).length!==need)continue;
    const elim=[];
    for(const j of H.cells)if(!candSet.has(j)&&!excl[j])elim.push(j);
    if(elim.length===0)continue;
    for(const j of elim)excl[j]=true;
    if(trace)trace.push({type:'pig',g:G.t,h:H.t,elim:elim.slice(),cand:cand.slice()});
    applied=true;break;
   }
  }
  if(!applied)return;
 }
}
/* 相邻窒息排除(双子): 与某组全部候选相邻的格必非子;组内候选与其余全部相邻且剩余≥2 时它也必非子 */
function applyAdj(lv,S,excl,groups,trace){
 const N=lv.n;let applied=false;
 for(const G of groups){
  const need=K-G.cells.filter(j=>S[j]===1).length;
  if(need<=0)continue;
  const cand=G.cells.filter(j=>!excl[j]&&S[j]!==1);
  if(cand.length<2)continue;
  let rlo=-99,rhi=99,clo=-99,chi=99;
  for(const c of cand){const r=(c/N)|0,cc=c%N;
   if(r-1>rlo)rlo=r-1;if(r+1<rhi)rhi=r+1;
   if(cc-1>clo)clo=cc-1;if(cc+1<chi)chi=cc+1;}
  if(rlo>rhi||clo>chi)continue;
  const candSet=new Set(cand);
  for(let r=Math.max(0,rlo);r<=Math.min(N-1,rhi);r++)
   for(let cc=Math.max(0,clo);cc<=Math.min(N-1,chi);cc++){
    const x=r*N+cc;
    if(excl[x]||S[x]===1)continue;
    const inC=candSet.has(x);
    if(inC&&(need<2||cand.length<=need))continue;
    let adjAll=true;
    for(const c of cand){
     if(c===x)continue;
     const cr=(c/N)|0,c2=c%N;
     if(Math.abs(cr-r)>1||Math.abs(c2-cc)>1){adjAll=false;break;}
    }
    if(!adjAll)continue;
    excl[x]=true;applied=true;
    if(trace)trace.push({type:'adj',g:G.t,cell:x});
   }
 }
 return applied;
}
function findSingle(lv,S,excl,groups){
 for(const G of groups){
  const need=K-G.cells.filter(j=>S[j]===1).length;
  if(need<=0)continue;
  const cand=G.cells.filter(j=>!excl[j]&&S[j]!==1);
  if(cand.length===need)return{g:G.t,cells:cand};
 }
 return null;
}
function solveFrom(lv,S0,mode,pig,flt,withMarks){
 const N=lv.n,S=S0.slice(),tot=K*N;
 let placed=0;for(let i=0;i<N*N;i++)if(S[i]===1)placed++;
 const steps=[],groups=buildGroups(lv,mode,flt||'full');
 while(placed<tot){
  const excl=padExcl(lv,S,mode,withMarks);
  for(;;){   /* 排除推进到不动点:鸽笼与相邻窒息交替(K=1 时 adj 不参与,行为不变) */
   let n=0;for(let j=0;j<N*N;j++)if(excl[j])n++;
   if(pig)applyPig(lv,S,excl,groups,steps);
   if(K>1)applyAdj(lv,S,excl,groups,steps);
   let m=0;for(let j=0;j<N*N;j++)if(excl[j])m++;
   if(m===n)break;
  }
  const hit=findSingle(lv,S,excl,groups);
  if(!hit)break;
  hit.cells.forEach(j=>{S[j]=1;placed++;});
  steps.push({type:'single',g:hit.g,cells:hit.cells.slice()});
 }
 return{placed,steps,S};
}

function build(){
 const lv=LV(),N=lv.n,NA=nightAlpha(N);
 ANCH=new Set(lv.anchors);
 scene.className='scene '+(N<=5?'n5':N===6?'n6':N<=8?'n8':N<=10?'n10':'n12');
 dayFace.innerHTML='';nightFace.innerHTML='';
 dayFace.style.gridTemplateColumns='repeat('+N+',1fr)';
 nightFace.style.gridTemplateColumns='repeat('+N+',1fr)';
 cellsD=[];cellsN=[];prev=new Array(N*N).fill(-1);
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const d=document.createElement('div');
  d.className='cell';d.style.setProperty('--day',dayCol(DL12.indexOf(lv.day[r][c])));
  d._i=r*N+c;
  dayFace.appendChild(d);cellsD[r*N+c]=d;
 }
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const d=document.createElement('div');
  d.className='cell';d.style.setProperty('--ngt',nightCol(NA.indexOf(lv.night[r][c])));
  d._i=r*N+c;
  nightFace.appendChild(d);cellsN[r*N+c]=d;
 }
 dotsEl.innerHTML='';
 for(let i=0;i<K*N;i++){const s=document.createElement('span');s.className='dot';dotsEl.appendChild(s);}
lvlchip.textContent='第'+CN[cur]+'关 · '+N+'×'+N;
}
function pads(){const a=[];for(let i=0;i<LV().n*LV().n;i++)if(S[i]===1)a.push(i);return a;}
function conflicts(){
 const lv=LV(),N=lv.n,P=pads(),bad=new Set(),cnt={};
 P.forEach(i=>{const r=(i/N)|0,c=i%N;
  ['r'+r,'c'+c,'D'+lv.day[r][c],'N'+lv.night[r][c]].forEach(k=>cnt[k]=(cnt[k]||0)+1);});
 P.forEach(i=>{const r=(i/N)|0,c=i%N;
  if(cnt['r'+r]>K||cnt['c'+c]>K||cnt['D'+lv.day[r][c]]>K||cnt['N'+lv.night[r][c]]>K)bad.add(i);});
 for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){
  const r1=(P[a]/N)|0,c1=P[a]%N,r2=(P[b]/N)|0,c2=P[b]%N;
  if(Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1){bad.add(P[a]);bad.add(P[b]);}}
 return bad;
}
function clearHints(){clearTimeout(moonT);document.querySelectorAll('.cell.hint,.cell.exclh').forEach(d=>d.classList.remove('hint','exclh'));}
function render(){
 const lv=LV(),N=lv.n,bad=conflicts();
 for(let i=0;i<N*N;i++){
  const v=S[i];
  if(v!==prev[i]){   /* 增量渲染:棋子节点保留,不重播入场动画 */
   const r=(i/N)|0,c=i%N;
   cellsD[i].innerHTML=(v===1?'<div class="pad"></div>':v===2?'<div class="x"></div>':'')
    +'<span class="lbl">'+lv.day[r][c]+'</span>';
   cellsN[i].innerHTML=(v===1?'<div class="pad"></div>':v===2?'<div class="x"></div>':'')
    +'<span class="lbl">'+lv.night[r][c]+'</span>';
   prev[i]=v;
  }
  const cls='cell'+(bad.has(i)?' bad':'');
  cellsD[i].className=cls;cellsN[i].className=cls;
 }
 updateDots();updateStatus();updateUrge();
}
function updateDots(){
 const lv=LV(),N=lv.n,T=K*N,P=pads(),ds=dotsEl.children;
 for(let i=0;i<T;i++){
  ds[i].className='dot'+(i<P.length?' on':'');
  if(i<P.length){          /* 点亮色 = 该子所在色块颜色,随翻转切换 */
   const p=P[i],r=(p/N)|0,c=p%N;
   ds[i].style.background=flipped
    ?nightCol(nightAlpha(N).indexOf(lv.night[r][c]))
    :dayCol(DL12.indexOf(lv.day[r][c]));
  }else ds[i].style.background='';
 }
}
function updateStatus(){
 const lv=LV(),N=lv.n,T=K*N,P=pads().length,bad=conflicts();
 if(P===T&&bad.size===0){
  statusEl.textContent='表里如一';statusEl.className='status ok';
  showWin();
 }else{
  statusEl.textContent=bad.size?'有冲突(红圈)':'';
  statusEl.className='status'+(bad.size?' err':'');
 }
}
function tap(i){
 if(winShown)return;
 if(S[i]===1&&ANCH.has(i)){
  clearHints();
  SND.tick();
  statusEl.textContent='这颗棋子是既定的,不可移动';
  statusEl.className='status';
  moonT=setTimeout(updateStatus,1500);
  return;
 }
 clearHints();
 if(S[i]===0){          /* 点空格:标 ✕ */
  undoStack.push(S.slice());if(undoStack.length>200)undoStack.shift();
  S[i]=2;
  render();SND.tick();
 }else if(S[i]===2){    /* 点 ✕:直接落子(不依赖双击时序,合并为一步撤销) */
  S[i]=1;
  render();SND.place();miniRipple(i);if(conflicts().has(i))SND.bad();
 }else{
  undoStack.push(S.slice());if(undoStack.length>200)undoStack.shift();
  S[i]=0;                /* 点棋子:收回 */
  render();SND.clear();
 }
}
function miniRipple(i){
 [cellsD[i],cellsN[i]].forEach(d=>{
  const m=document.createElement('div');m.className='mrip';d.appendChild(m);
  setTimeout(()=>m.remove(),500);
 });
}
function undo(){
 if(!undoStack.length)return;
 S=undoStack.pop();clearHints();render();SND.ui();
}
window.undo=undo;
function syncFace(){
 clearTimeout(flipVisT);
 const c=document.getElementById('card');
 c.classList.toggle('flipped',flipped);
 flipVisT=setTimeout(()=>{c.classList.toggle('showN',flipped);},300);   /* 半程(两面均侧对)切显隐——iOS backface 失效兜底 */
}
function flip(){
 flipped=!flipped;flips++;
 syncFace();
 document.body.classList.toggle('deep',flipped);
 const rp=document.getElementById('ripple');
 rp.classList.remove('go');void rp.offsetWidth;rp.classList.add('go');
 SND.flip();updateDots();
 if(!document.querySelector('.cell.hint,.cell.exclh'))updateStatus();
 updateUrge();
}
window.flip=flip;
function updateUrge(){
 const lv=LV();
 if(lv.hf!=='both'||flipped||winShown){flipBtn.classList.remove('urge');return;}
 const N=lv.n,T=K*N;let placed=0;for(let i=0;i<N*N;i++)if(S[i]===1)placed++;
 if(placed>=T){flipBtn.classList.remove('urge');return;}
 const r=solveFrom(lv,S,'day',lv.pig);
 flipBtn.classList.toggle('urge',r.placed===placed);
}

/* ---- 提示:①视角内单候选(计数=玩家当前所见,不预支另一面) ①′跨面可排(虚线圈=翻面即可排除的格,实线圈=剩下的必放格)
   ②鸽笼包含(实线圈候选/虚线圈排除,标✕后生效) ③相邻窒息(双子) ①″兜底教学 ④死路 ---- */
const GK=g=>g;   /* 提示文字:区域字母与其他文字一致 */
function findSingleH(groups,exclOf){
 for(const G of groups){
  const need=K-G.cells.filter(j=>S[j]===1).length;
  if(need<=0)continue;
  const ex=exclOf(G);
  const cand=G.cells.filter(j=>!ex[j]&&S[j]!==1);
  if(cand.length===need)return{g:G.t,cells:cand};
 }
 return null;
}
function pigStepH(groups,exclOf){
 for(const G of groups){
  const need=K-G.cells.filter(j=>S[j]===1).length;
  if(need<=0)continue;
  const ex=exclOf(G);
  const cand=G.cells.filter(j=>!ex[j]&&S[j]!==1);
  if(cand.length<need)continue;
  const candSet=new Set(cand);
  for(const H of groups){
   if(H===G)continue;
   if(H.cells.length<cand.length)continue;
   let sub=true;
   for(const j of cand){if(!H.cellSet.has(j)){sub=false;break;}}
   if(!sub)continue;
   if(K-H.cells.filter(j=>S[j]===1).length!==need)continue;
   const exH=exclOf(H);
   const elim=H.cells.filter(j=>!candSet.has(j)&&!exH[j]);
   if(elim.length===0)continue;
   return{g:G.t,h:H.t,cand:cand.slice(),elim:elim.slice()};
  }
 }
 return null;
}
function adjStepH(lv,groups,exclOf,vCur){
 const N=lv.n;
 for(const G of groups){
  const need=K-G.cells.filter(j=>S[j]===1).length;
  if(need<=0)continue;
  const ex=exclOf(G);
  const cand=G.cells.filter(j=>!ex[j]&&S[j]!==1);
  if(cand.length<2)continue;
  let rlo=-99,rhi=99,clo=-99,chi=99;
  for(const c of cand){const r=(c/N)|0,cc=c%N;
   if(r-1>rlo)rlo=r-1;if(r+1<rhi)rhi=r+1;
   if(cc-1>clo)clo=cc-1;if(cc+1<chi)chi=cc+1;}
  if(rlo>rhi||clo>chi)continue;
  const candSet=new Set(cand);
  for(let r=Math.max(0,rlo);r<=Math.min(N-1,rhi);r++)
   for(let cc=Math.max(0,clo);cc<=Math.min(N-1,chi);cc++){
    const x=r*N+cc;
    if(vCur[x]||S[x]===1)continue;
    const inC=candSet.has(x);
    if(inC&&(need<2||cand.length<=need))continue;
    let adjAll=true;
    for(const c of cand){
     if(c===x)continue;
     const cr=(c/N)|0,c2=c%N;
     if(Math.abs(cr-r)>1||Math.abs(c2-cc)>1){adjAll=false;break;}
    }
    if(!adjAll)continue;
    return{g:G.t,cell:x};
   }
 }
 return null;
}
function hint(){
 if(document.querySelector('.cell.hint,.cell.exclh')){clearHints();updateStatus();SND.ui();return 'off';}
 clearHints();hintsUsed++;
 const lv=LV(),mode=lv.hf==='day'?'day':'mix';
 const groups=buildGroups(lv,mode,'full');
 const NN=lv.n*lv.n;
 const exclD=padExcl(lv,S,'day',true),exclN=padExcl(lv,S,'night',true);
 const vCur=flipped?exclN:exclD;              /* 玩家当前视角可见的排除(✕ 已含) */
 const mExcl=padExcl(lv,S,mode,true);         /* 求解器视角(两面同计):发现「翻面可排」格 */
 const other=flipped?'正面':'背面';
 const exclOf=G=>G.t[0]==='背'?exclN:G.t[0]==='正'?exclD:vCur;
 const mark=(cells,cls)=>cells.forEach(j=>{cellsD[j].classList.add(cls);cellsN[j].classList.add(cls);});
 /* ① 单候选:只数玩家当前视角可见的排除——报出的数字当场可验证 */
 const hit=findSingleH(groups,exclOf);
 if(hit){
  mark(hit.cells,'hint');
  const nc=hit.cells.length;
  const ask=(hit.g[0]==='背'&&!flipped)||(hit.g[0]==='正'&&flipped)?'——翻到'+other+'看看':'';
  statusEl.innerHTML=GK(hit.g)+'只剩这 '+nc+' 格'+(nc===1?' → 必有 1 子':' → 每格都放子')+ask;
  statusEl.className='status hintst';
  return hit.g+'#'+hit.cells.join(',');
 }
 /* 跨面可排格:求解器已排除、当前视角看不见(另一面色区放满所致) */
 const hidden=[];
 for(let j=0;j<NN;j++)if(mExcl[j]&&!vCur[j]&&S[j]!==1)hidden.push(j);
 /* ①′ 点名:某组排除虚线圈格后恰成单候选——把卡点说破(不分组的面别) */
 let mHit=null;
 for(const G of groups){
  const need=K-G.cells.filter(j=>S[j]===1).length;
  if(need<=0)continue;
  const cand=G.cells.filter(j=>!mExcl[j]&&S[j]!==1);
  if(cand.length!==need)continue;
  mHit={g:G.t,cells:cand,grp:G};break;
 }
 if(mHit){
  const exG=exclOf(mHit.grp);
  const candH=mHit.grp.cells.filter(j=>!exG[j]&&S[j]!==1);
  const hid=candH.filter(j=>mHit.cells.indexOf(j)<0);
  if(hid.length){
   mark(mHit.cells,'hint');mark(hid,'exclh');
   const nc=mHit.cells.length;
   const tail=nc===1?'这 1 格必有子':' '+nc+' 格都放子';
   const grpOther=(mHit.g[0]==='背'&&!flipped)||(mHit.g[0]==='正'&&flipped);
   statusEl.innerHTML=grpOther
    ?GK(mHit.g)+'还剩 '+(nc+hid.length)+' 格:虚线圈 '+hid.length+' 格的'+(flipped?'背面':'正面')+'色区已满,标 ✕'
     +' → 翻到'+other+'看:剩下实线圈出的'+tail
    :GK(mHit.g)+'还剩 '+(nc+hid.length)+' 格:虚线圈 '+hid.length+' 格翻到'+other+'就能排掉(色区已满)'
     +' → 剩下实线圈出的'+tail;
   statusEl.className='status hintst';
   return 'flip:'+mHit.g+'#'+hid.join(',')+'>'+mHit.cells.join(',');
  }
 }
 /* ② 鸽笼包含(视角内可验证) */
 if(lv.pig){
  const p=pigStepH(groups,exclOf);
  if(p){
   mark(p.cand,'hint');mark(p.elim,'exclh');
   const rel=(p.g[0]==='背'||p.h[0]==='背')&&!flipped?'——线索在背面,翻过去看'
    :(p.g[0]==='正'||p.h[0]==='正')&&flipped?'——线索在正面,翻回去看':'';
   statusEl.innerHTML=GK(p.g)+'的候选(实线圈)全落在'+GK(p.h)+'内 → 其余 '+p.elim.length+' 格(虚线圈)可标 ✕'+rel;
   statusEl.className='status hintst';
   return 'pig:'+p.g+'>'+p.h;
  }
 }
 /* ③ 相邻窒息(双子) */
 if(K>1){
  const a=adjStepH(lv,groups,exclOf,vCur);
  if(a){
   mark([a.cell],'exclh');
   const rel=a.g[0]==='背'&&!flipped?'——线索在背面,翻过去看':a.g[0]==='正'&&flipped?'——线索在正面,翻回去看':'';
   statusEl.innerHTML='这格与'+GK(a.g)+'的全部候选相邻——子落哪它都放不下,可标 ✕'+rel;
   statusEl.className='status hintst';
   return 'adj:'+a.g+'#'+a.cell;
  }
 }
 /* ①″ 兜底教学:②③都无解时,虚线圈标出全部「翻面可排」格 */
 if(hidden.length){
  mark(hidden,'exclh');
  statusEl.innerHTML='虚线圈 '+hidden.length+' 格翻到'+other+'就能排掉(色区已放满) → 标 ✕ 后继续';
  statusEl.className='status hintst';
  return 'flip:#'+hidden.join(',');
 }
 statusEl.textContent='此路推不动:检查 ✕ 是否标错,或撤销/重置';
 statusEl.className='status err';
 return 'dead';
}
window.hint=hint;


/* ---- 通关 / 选关 ---- */
function drawEmblem(){
 const lv=LV(),N=lv.n,nab=nightAlpha(N);
 const c=N<=6?15:N<=8?12:N<=10?10:8,gap=N>6?1:2;
 const emb=document.getElementById('emblem');
 emb.innerHTML='';

function tBoard(rows,dark,pads,marks,ring){
 const b=document.createElement('div');b.className='tboard'+(dark?' dark':'');
 const n=rows[0].length;
 if(n>=8){b.classList.add('s');b.style.gridTemplateColumns='repeat('+n+',17px)';}
 else b.style.gridTemplateColumns='repeat('+n+',25px)';
 const NA=nightAlpha(rows.length);
 rows.forEach((row,r)=>{[...row].forEach((ch,c)=>{
  const d=document.createElement('div');d.className='cell';
  d.style.background=dark?nightCol(NA.indexOf(ch)):dayCol(DL12.indexOf(ch));
  if(pads&&pads.some(p=>p[0]===r&&p[1]===c)){const p=document.createElement('div');p.className='pad';d.appendChild(p);}
  if(marks&&marks.some(m=>m[0]===r&&m[1]===c)){const x=document.createElement('div');x.className='x';d.appendChild(x);}
  if(ring){const rs=Array.isArray(ring[0])?ring:[ring];
   if(rs.some(p=>p[0]===r&&p[1]===c))d.classList.add('tring');}
  b.appendChild(d);});});
 return b;
}
let demoTimers=[];

function dragDemo(board,row){
 const cells=[...board.children].filter(d=>d.classList.contains('cell'));
 const n=Math.round(Math.sqrt(cells.length));
 const rc=cells.slice(row*n,row*n+n);
 const fg=document.createElement('div');fg.className='dfg';board.appendChild(fg);
 const P=i=>{const c=rc[i];return [c.offsetLeft+c.offsetWidth/2-9,c.offsetTop+c.offsetHeight/2-9];};
 const cycle=k=>{
  if(!board.isConnected)return;
  if(k===0){
   fg.style.transition='opacity .3s';fg.style.left=P(0)[0]+'px';fg.style.top=P(0)[1]+'px';
   rc.forEach(c=>{const x=c.querySelector('.x');if(x)x.remove();});
   demoTimers.push(setTimeout(()=>{fg.style.opacity='1';},80));
   demoTimers.push(setTimeout(()=>cycle(1),420));return;
  }
  if(k<=rc.length){
   const i=k-1;
   fg.style.transition='left 370ms linear,opacity .3s';fg.style.left=P(i)[0]+'px';
   demoTimers.push(setTimeout(()=>{
    const x=document.createElement('div');x.className='x pop';rc[i].appendChild(x);
   },330));
   demoTimers.push(setTimeout(()=>cycle(k+1),430));return;
  }
  demoTimers.push(setTimeout(()=>{
   rc.forEach(c=>{const x=c.querySelector('.x');if(x)x.classList.add('fade');});
   fg.style.opacity='0';
  },1400));
  demoTimers.push(setTimeout(()=>cycle(0),2100));
 };
 cycle(0);
}

/* ---- 指针交互:单击循环 + 拖动画✕/擦✕(横竖四方向,一次拖动一次撤销) ---- */
let drag=null;
function pDown(e){
 if(winShown)return;
 if(drag)return;
 const t=e.target.closest('.cell');if(!t)return;
 const i=t._i;if(i===undefined)return;
 e.preventDefault();
 try{t.setPointerCapture(e.pointerId);}catch(err){}
 const rc=t.getBoundingClientRect(),N=LV().n;
 drag={i0:i,r0:(i/N)|0,c0:i%N,x0:rc.left+rc.width/2,y0:rc.top+rc.height/2,
  pitch:rc.width,dir:null,erase:S[i]===2,piece:S[i]===1};
}
function pMove(e){
 if(!drag)return;
 const N=LV().n,dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
 if(Math.hypot(dx,dy)<drag.pitch*0.45)return;
 if(!drag.dir){
  const q=((Math.round(Math.atan2(dy,dx)/(Math.PI/2))%4)+4)%4;
  const dirs=[[0,1],[1,0],[0,-1],[-1,0]];
  drag.dir=dirs[q];
  if(!drag.piece){
   undoStack.push(S.slice());if(undoStack.length>200)undoStack.shift();
   clearHints();
  }
 }
 if(drag.piece)return;
 const proj=dx*drag.dir[1]+dy*drag.dir[0];
 let steps=Math.round(proj/drag.pitch);
 if(steps<0)steps=0;if(steps>N-1)steps=N-1;
 let changed=false;
 for(let s=0;s<=steps;s++){
  const rr=drag.r0+drag.dir[0]*s,cc=drag.c0+drag.dir[1]*s;
  if(rr<0||rr>=N||cc<0||cc>=N)break;
  const j=rr*N+cc;
  if(drag.erase){if(S[j]===2){S[j]=0;changed=true;}}
  else if(S[j]===0){S[j]=2;changed=true;}
 }
 if(changed){render();SND.tick();}
}
function pUp(){
 if(!drag)return;
 const d=drag;drag=null;
 if(!d.dir)tap(d.i0);          /* 未拖动 = 点击:空→✕→子→空 三态循环 */
}
function pCancel(){drag=null;}
[dayFace,nightFace].forEach(f=>{
 f.addEventListener('pointerdown',pDown);
 f.addEventListener('pointermove',pMove);
 f.addEventListener('pointerup',pUp);
 f.addEventListener('pointercancel',pCancel);
});

/* ---- 回归钩子 ---- */
window.__selftest=function(){
 return LEVELS.map((lv,i)=>{
  const N=lv.n,S0=new Array(N*N).fill(0);
  lv.anchors.forEach(j=>S0[j]=1);
  const mix=solveFrom(lv,S0,'mix',lv.pig);
  const mnp=solveFrom(lv,S0,'mix',false);
  const d=solveFrom(lv,S0,'day',lv.pig);
  const nt=solveFrom(lv,S0,'night',lv.pig);
  const okBoard=lv.sol.every((c,r)=>mix.S[r*N+c]===1);
  return{id:i+1,n:N,k:lv.anchors.length,mix:mix.placed,mixNopig:mnp.placed,
   day:d.placed,night:nt.placed,
   pigs:mix.steps.filter(s=>s.type==='pig').length,
   ok:mix.placed===N&&okBoard,
   chain:mix.steps.filter(s=>s.type==='single').map(s=>s.g).join(',')};
 });
};
window.__selftest2=function(){
 const old=K;K=2;
 try{
  return LEVELS2.map((lv,i)=>{
   const N=lv.n,tot=2*N,S0=new Array(N*N).fill(0);
   lv.anchors.forEach(j=>S0[j]=1);
   const mix=solveFrom(lv,S0,'mix',lv.pig);
   const d=solveFrom(lv,S0,'day',lv.pig);
   const nt=solveFrom(lv,S0,'night',lv.pig);
   const okBoard=lv.sol.every((cs,r)=>cs.every(c=>mix.S[r*N+c]===1));
   return{id:i+1,n:N,ac:lv.anchors.length,mix:mix.placed,day:d.placed,night:nt.placed,
    pigs:mix.steps.filter(s=>s.type==='pig').length,
    ok:mix.placed===tot&&okBoard&&d.placed<tot&&nt.placed<tot};
  });
 }finally{K=old;}
};
